version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - ./backend/data/processed:/app/data/processed
      - ./backend/artifacts:/app/artifacts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

